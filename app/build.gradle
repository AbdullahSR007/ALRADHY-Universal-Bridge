plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.alradhy.universalbridge'
    compileSdk 35
    defaultConfig {
        applicationId 'com.alradhy.universalbridge'
        minSdk 26
        targetSdk 34
        versionCode 300
        versionName '0.3.0-beta1'
    }
    buildFeatures { buildConfig true }
    packaging {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }
    flavorDimensions 'device'
    productFlavors {
        mobile { dimension 'device'; applicationIdSuffix '.mobile' }
        tv { dimension 'device'; applicationIdSuffix '.tv' }
        tvhub { dimension 'device'; applicationIdSuffix '.tvhub' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
}
