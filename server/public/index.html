<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ALRADHY Universal Bridge & TV Remote</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #121212; color: #fff; padding: 20px; text-align: center; }
        .box { background: #1e1e1e; padding: 20px; border-radius: 12px; margin: 15px auto; max-width: 600px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        textarea { width: 90%; height: 100px; background: #2c2c2c; color: #fff; border: 1px solid #444; border-radius: 8px; padding: 10px; font-size: 16px; }
        button { background: #00bcd4; color: #000; border: none; padding: 12px 20px; margin: 5px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        button:hover { background: #00acc1; }
        .remote-grid { display: grid; grid-template-columns: repeat(3, 80px); gap: 10px; justify-content: center; margin-top: 15px; }
    </style>
</head>
<body>
    <h1>🎮 ALRADHY Universal Bridge</h1>
    <div class="box">
        <h3>📋 مشاركة الحافظة (Clipboard Sync)</h3>
        <textarea id="clipText" placeholder="اكتب أو الصق أي نص هنا لمزامنته..."></textarea>
        <br><button onclick="sendClip()">مزامنة النص</button>
    </div>
    <div class="box">
        <h3>📺 ريموت أندرويد تي في</h3>
        <div class="remote-grid">
            <div></div><button onclick="sendKey(19)">⬆️</button><div></div>
            <button onclick="sendKey(21)">⬅️</button><button onclick="sendKey(66)">⭕ OK</button><button onclick="sendKey(22)">➡️</button>
            <div></div><button onclick="sendKey(20)">⬇️</button><div></div>
        </div>
        <div style="margin-top: 15px;">
            <button onclick="sendKey(4)">↩️ رجوع</button>
            <button onclick="sendKey(3)">🏠 الرئيسية</button>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const clipInput = document.getElementById('clipText');
        clipInput.addEventListener('input', () => socket.emit('sync-clipboard', clipInput.value));
        function sendClip() { socket.emit('sync-clipboard', clipInput.value); alert("تم الإرسال!"); }
        socket.on('update-clipboard', (text) => { clipInput.value = text; });
        function sendKey(keyCode) { socket.emit('remote-command', { keyCode: keyCode }); }
    </script>
</body>
</html>
