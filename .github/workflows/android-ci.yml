name: Universal Bridge v0.1 Android
on:
  push:
    branches:
      - feature/**
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (preinstalled on GitHub runner)
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses < /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify Web JavaScript syntax
        run: |
          python3 -c "from pathlib import Path; s=Path('app/src/main/assets/web/index.html').read_text(); Path('/tmp/bridge-web.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/bridge-web.js
      - name: Verify Unicode transport regression guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html=Path("app/src/main/assets/web/index.html").read_text(encoding="utf-8")
          core=Path("app/src/main/java/com/alradhy/universalbridge/BridgeCore.kt").read_text(encoding="utf-8")
          assert "application/json; charset=UTF-8" in html, "Missing UTF-8 request charset"
          assert "/api/native/echo" in core, "Native Unicode round-trip check missing"
          sample="بسم الله الرحمن الرحيم — اختبار العربية ١٢٣"
          import json
          body=json.dumps({"text":sample},ensure_ascii=False).encode("utf-8")
          assert json.loads(body.decode("utf-8"))["text"]==sample, "Unicode round trip failed"
          print("Unicode transport regression checks passed")
          PY
      - name: Build mobile and TV APK
        run: gradle --no-daemon --stacktrace :app:assembleMobileDebug :app:assembleTvDebug
      - name: Package and SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/mobile/debug/app-mobile-debug.apk dist/ALRADHY-Universal-Bridge-Mobile-v0.2.4.apk
          cp app/build/outputs/apk/tv/debug/app-tv-debug.apk dist/ALRADHY-Universal-Bridge-TV-v0.2.4.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          printf '{"repository":"AbdullahSR007/ALRADHY-Universal-Bridge","branch":"%s","commitSha":"%s","runId":"%s","version":"0.2.4","signing":"debug-key; NOT stable for updates"}\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_RUN_ID" > dist/build-info.json
      - name: Upload verified build outputs
        uses: actions/upload-artifact@v4
        with:
          name: ALRADHY-Universal-Bridge-v0.2.4
          path: dist/*
          if-no-files-found: error
          retention-days: 14
